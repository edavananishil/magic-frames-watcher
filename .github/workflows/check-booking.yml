name: Check Magic Frames Booking

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run booking check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_booking.py

      - name: Commit state if it changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "booking-bot"
            git config user.email "booking-bot@users.noreply.github.com"
            git add state.json
            git commit -m "Update state"
            git push
          fi
